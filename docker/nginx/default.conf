server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php index.html;

    # Docker's DNS: re-resolve php on each request so recreating the php
    # container doesn't leave nginx pointing at a stale IP (502s).
    resolver 127.0.0.11 valid=10s;
    set $php_upstream php:9000;

    charset utf-8;
    # Uploads go up to MERIDIAN_MAX_UPLOAD_KB (512 MB by default).
    client_max_body_size 600M;
    client_body_timeout 300s;
    fastcgi_read_timeout 300s;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass $php_upstream;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 300s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml application/xml+rss image/svg+xml;
}
