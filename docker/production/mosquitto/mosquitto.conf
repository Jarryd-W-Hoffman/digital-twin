# Meridian's broker in production. Devices connect over TLS on 8883 with the
# same certificate Caddy keeps for the domain; 1883 is only for containers on
# the stack's own network, such as a gateway run beside the control plane.
# Nobody connects anonymously: mosquitto-go-auth asks the app about every
# login and topic. start.sh fills in the @...@ values.
per_listener_settings false
allow_anonymous false
persistence true
persistence_location /mosquitto/data/
log_dest stdout

listener 8883
certfile @CERT@
keyfile @KEY@

listener 1883

auth_plugin /mosquitto/go-auth.so
auth_opt_backends http
auth_opt_http_host web
auth_opt_http_port 8080
auth_opt_http_getuser_uri /api/mqtt/@AUTH_SECRET@/user
auth_opt_http_aclcheck_uri /api/mqtt/@AUTH_SECRET@/acl
auth_opt_http_params_mode json
auth_opt_http_response_mode status
auth_opt_http_timeout 5
auth_opt_disable_superuser true
auth_opt_cache true
auth_opt_cache_type go-cache
auth_opt_cache_reset true
auth_opt_auth_cache_seconds 30
auth_opt_acl_cache_seconds 30
auth_opt_auth_jitter_seconds 3
auth_opt_acl_jitter_seconds 3
auth_opt_log_level info
