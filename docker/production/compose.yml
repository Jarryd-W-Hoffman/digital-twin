name: ${MERIDIAN_STACK:-meridian-production}

# Meridian in production on one server. Set up with
# `docker/production/meridian install`; see docs/manual/23-deploying.md.
#
#   web        Caddy: HTTPS on 80/443, the public files, PHP over FastCGI
#   app        php-fpm
#   worker     the default queue: notifications, imports, reports
#   scheduler  alerts, escalation, anomaly checks, reports, clean-up
#   converter  the conversions queue: scans, meshes, terrain, map layers
#   migrate    runs migrations, then exits, before the others start
#   postgres, redis
#   mosquitto  (profile mqtt) the broker devices publish to, TLS on 8883
#   gateway    (profile gateway) one twin's gateway, at wss://<domain>/gateway/ws

x-app: &app
  image: meridian/app:${MERIDIAN_VERSION:-local}
  build:
    context: ../..
    dockerfile: docker/production/Dockerfile
    target: app
  env_file: .env
  restart: unless-stopped
  volumes:
    - storage:/var/www/html/storage
  networks:
    - meridian

services:
  web:
    image: meridian/web:${MERIDIAN_VERSION:-local}
    build:
      context: ../..
      dockerfile: docker/production/Dockerfile
      target: web
    restart: unless-stopped
    environment:
      MERIDIAN_DOMAIN: ${MERIDIAN_DOMAIN:?Set MERIDIAN_DOMAIN in docker/production/.env}
      ACME_EMAIL: ${ACME_EMAIL:-}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/up || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      app:
        condition: service_healthy
    networks:
      - meridian

  app:
    <<: *app
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(fsockopen(\"127.0.0.1\", 9000) ? 0 : 1);'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      migrate:
        condition: service_completed_successfully

  migrate:
    <<: *app
    command: ["php", "artisan", "migrate", "--force"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    <<: *app
    command: ["php", "artisan", "queue:work", "--tries=3", "--timeout=1800", "--sleep=3", "--max-time=3600"]
    stop_grace_period: 30m
    depends_on:
      migrate:
        condition: service_completed_successfully

  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  converter:
    image: meridian/converter:${MERIDIAN_VERSION:-local}
    build:
      context: ../..
      dockerfile: docker/production/Dockerfile
      target: converter
      additional_contexts:
        converter-tools: service:converter-tools
    env_file: .env
    restart: unless-stopped
    # py3dtiles shares point batches between its worker processes in /dev/shm.
    shm_size: 2gb
    stop_grace_period: 30m
    volumes:
      - storage:/var/www/html/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - meridian

  # Only built, as the base of the converter: docker/converter's tools.
  converter-tools:
    image: meridian/converter-tools:${MERIDIAN_VERSION:-local}
    build:
      context: ../converter
    profiles:
      - build

  postgres:
    image: timescale/timescaledb:2.24.0-pg18
    restart: unless-stopped
    command: ["postgres", "-c", "shared_preload_libraries=timescaledb", "-c", "timescaledb.telemetry_level=off"]
    environment:
      POSTGRES_DB: ${DB_DATABASE:-meridian}
      POSTGRES_USER: ${DB_USERNAME:-meridian}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in docker/production/.env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - meridian

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis-data:/data
    networks:
      - meridian

  mosquitto:
    image: iegomez/mosquitto-go-auth:3.0.0-mosquitto_2.0.18
    restart: unless-stopped
    entrypoint: ["/usr/bin/tini", "--", "/bin/sh", "/meridian/start.sh"]
    environment:
      MERIDIAN_DOMAIN: ${MERIDIAN_DOMAIN}
      MERIDIAN_MQTT_AUTH_SECRET: ${MERIDIAN_MQTT_AUTH_SECRET:-}
    ports:
      - "${MQTT_PORT:-8883}:8883"
    volumes:
      - ./mosquitto:/meridian:ro
      - caddy-data:/caddy-data:ro
      - mosquitto-data:/mosquitto/data
    depends_on:
      web:
        condition: service_healthy
    profiles:
      - mqtt
    networks:
      - meridian

  gateway:
    image: meridian/gateway:${MERIDIAN_VERSION:-local}
    build:
      context: ../..
      dockerfile: docker/production/Dockerfile
      target: gateway
    restart: unless-stopped
    environment:
      MERIDIAN_URL: http://web:8080
      MERIDIAN_GATEWAY_TOKEN: ${MERIDIAN_GATEWAY_TOKEN:-}
      GATEWAY_PUBLIC_URL: wss://${MERIDIAN_DOMAIN}/gateway/ws
      GATEWAY_ORIGINS: https://${MERIDIAN_DOMAIN}
      MQTT_URL: mqtt://mosquitto:1883
    depends_on:
      web:
        condition: service_healthy
    profiles:
      - gateway
    networks:
      - meridian

networks:
  meridian:

volumes:
  storage:
  postgres-data:
  redis-data:
  caddy-data:
  caddy-config:
  mosquitto-data:
